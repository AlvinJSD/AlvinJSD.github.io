<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-mood="welcome">

  <header class="topbar">
    <div class="wrap">
      <a href="#welcome" class="logo">Gallery</a>
      <nav id="nav" aria-label="Moods"></nav>
    </div>
  </header>

  <!-- Every view (welcome, each mood, favorites) is rendered here by js/main.js -->
  <main id="view" class="wrap"></main>

  <footer>
    <a href="../index.html" class="btn">Return to Profile</a>
  </footer>

  <!-- Photo viewer -->
  <dialog id="lightbox" aria-label="Photo viewer">
    <img id="lb-img" src="" alt="">
    <p id="lb-cap"></p>
    <div class="lb-bar">
      <button id="lb-prev" aria-label="Previous photo">&#8592;</button>
      <span id="lb-count"></span>
      <button id="lb-next" aria-label="Next photo">&#8594;</button>
      <button id="lb-heart" aria-label="Favorite this photo" aria-pressed="false">&#9825;</button>
      <button id="lb-play" aria-label="Play slideshow" aria-pressed="false">&#9654;</button>
      <button id="lb-close" aria-label="Close viewer">&#10005;</button>
    </div>
  </dialog>

  <script src="js/main.js"></script>
</body>

</html>
